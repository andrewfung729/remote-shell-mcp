version: 2

project_name: remote-shell-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: daemon
    main: ./cmd/remote-shell-mcpd
    binary: remote-shell-mcpd
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

# Combined amd64+arm64 Mach-O so a single tarball runs on any modern Mac.
universal_binaries:
  - id: daemon-universal
    ids: [daemon]
    name_template: remote-shell-mcpd
    replace: false

archives:
  - id: default
    ids: [daemon]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

  - id: universal
    ids: [daemon-universal]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_darwin_universal
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs?:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

release:
  github:
    owner: andrewfung729
    name: remote-shell-mcp
  header: |
    ## remote-shell-mcp {{ .Tag }}

    Single daemon binary (remote-shell-mcpd). Download the archive for your
    platform, run it, then point your MCP client at the published /rpc or
    /sse endpoint with the bearer token from daemon.json.
